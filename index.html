<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Central São Luís Coworking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout (visual único branco e azul, cores da marca): barra lateral azul fixa à esquerda + área de trabalho; no celular a barra vira faixa de abas no topo. */
:root{
  color-scheme:light;
  --bg:#f4f7fc; --surface:#ffffff; --surface-2:#eaf1fb; --ink:#0f2347; --muted:#55688c; --line:#d6e1f1;
  --accent:#1550b8; --accent-soft:#e3edfc; --accent-ink:#ffffff; --ocre:#4f9cf0; --ocre-soft:#e3f0ff;
  --side:#0f3a86; --side-2:#1a4ea6; --side-ink:#ffffff; --side-muted:#b9cdf0;
  --ok:#1a7a4a; --ok-soft:#ddf2e6; --warn:#a85f00; --warn-soft:#fdf0d9; --bad:#b3261e; --bad-soft:#fbe1de;
  --shadow:0 12px 32px rgba(15,35,71,.18);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}

html,body{height:100%;margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-left:max(0px, env(safe-area-inset-left,0px))}
.brand{padding:22px 20px 14px;border-bottom:1px solid var(--side-2)}
.brand img{display:block;width:100%;max-width:190px;height:auto}
.brand span{display:block;margin-top:10px;font-size:.72rem;color:var(--side-muted);letter-spacing:.1em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;padding:8px 10px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-2)}
.nav a[aria-current="page"]{background:#ffffff;color:var(--side);font-weight:700}
.nav .badge{margin-left:auto;background:#ffffff;color:var(--side);font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 7px}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{padding:12px 20px 18px;font-size:.78rem;color:var(--side-muted)}

.main{min-width:0;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:space-between}
.head p{margin:4px 0 0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.banner{border-radius:10px;padding:10px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft);color:var(--ink)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.kpi small{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi strong{font-family:var(--f-display);font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi.bad strong{color:var(--bad)} .kpi.ok strong{color:var(--ok)} .kpi.warn strong{color:var(--warn)}
.kpi.bad::before,.kpi.warn::before,.kpi.ok::before{content:"";position:absolute;inset:0 auto 0 0;width:4px}
.kpi.bad::before{background:var(--bad)} .kpi.warn::before{background:var(--warn)} .kpi.ok::before{background:var(--ok)}

.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.panel-h p{margin:2px 0 0;color:var(--muted);font-size:.82rem}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
td.acts{text-align:right;white-space:nowrap}
td .sub{display:block;color:var(--muted);font-size:.78rem}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}

.pill{display:inline-block;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.mute{background:var(--surface-2);color:var(--muted)}

.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.82rem;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:#ffffff;border-color:var(--accent)}
.chip em{font-style:normal;opacity:.7;margin-left:4px}

.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.search{width:min(320px,100%)}

.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-size:.9rem}

/* agenda do dia */
.agenda{overflow-x:auto}
.ag{min-width:720px;display:grid;grid-template-columns:150px minmax(0,1fr);row-gap:6px}
.ag-hours{display:grid;grid-template-columns:repeat(15,1fr);font-size:.7rem;color:var(--muted)}
.ag-name{font-weight:600;font-size:.85rem;align-self:center;padding-right:8px}
.ag-name small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.ag-track{position:relative;height:42px;border-radius:8px;background:
  repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px calc(100% / 15)), var(--surface-2)}
.ag-blk{position:absolute;top:4px;bottom:4px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;padding:3px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:0;cursor:pointer;text-align:left;line-height:1.2}
.ag-blk.done{background:var(--muted);color:var(--surface)}
.ag-blk.live{background:var(--ocre);color:#ffffff}
.ag-now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}

/* funil */
.kanban{overflow-x:auto;padding-bottom:4px}
.kb{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;min-width:1320px}
.kb-col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.kb-col h3{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.kb-col h3 span{font-family:var(--f-body);font-size:.78rem;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.card b{font-size:.92rem}
.card .meta{color:var(--muted);font-size:.78rem}
.card .row{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.card .due{color:var(--bad);font-weight:600}

.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .l{min-width:0}
.li .l b{display:block;font-size:.9rem;font-weight:600}
.li .l span{color:var(--muted);font-size:.8rem}
.li .r{text-align:right;white-space:nowrap}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,18,32,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;
  padding-top:max(40px, env(safe-area-inset-top,0px));padding-bottom:max(24px, env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);display:flex;flex-direction:column}
.modal header{padding:18px 20px 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal form{display:flex;flex-direction:column}
.fields{padding:10px 20px 4px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:.78rem;font-weight:600;color:var(--muted)}
.field .input{width:100%}
.field textarea{min-height:70px;resize:vertical}
.check{flex-direction:row;align-items:center;gap:8px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px 18px}
.form-err{color:var(--bad);font-size:.85rem;padding:0 20px;min-height:0}
.modal p.msg{padding:6px 20px 0;margin:0;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

svg text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}

@media (max-width:980px){ .grid2,.grid3{grid-template-columns:minmax(0,1fr)} }
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;padding-left:0}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
  .side-foot{display:none}
  .brand{padding:12px max(16px, env(safe-area-inset-left,0px)) 6px;border-bottom:0}
  .brand img{max-width:130px}
  .brand span{display:none}
  .nav{flex-direction:row;overflow-x:auto;padding:4px max(12px, env(safe-area-inset-left,0px)) 10px;flex:none}
  .nav a{white-space:nowrap;padding:7px 11px}
  .nav svg{display:none}
  .fields{grid-template-columns:1fr}
  h1{font-size:1.45rem}
}
@media (prefers-reduced-motion:no-preference){ .overlay{animation:fade .15s ease-out} @keyframes fade{from{opacity:0}} }

/* login */
body.auth .side{display:none}
body.auth .app{grid-template-columns:minmax(0,1fr)}
.login{max-width:400px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.login img{width:200px;height:auto}
.login form{display:flex;flex-direction:column;gap:12px}
.login .field .input{width:100%}
.login p{margin:0;color:var(--muted);font-size:.9rem}
.side-foot button{margin-top:8px;background:transparent;border:1px solid var(--side-2);color:var(--side-ink);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.8rem}
.side-foot .who{display:block;margin-top:6px;word-break:break-all}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="logo-branca.png" alt="São Luís Coworking" width="640" height="201"><span>Central de gestão</span></div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
"use strict";
const COLS=['clientes','espacos','planos','contas','reservas','contratos','lancamentos','leads'];
const S={}; COLS.forEach(c=>S[c]=[]);
let mode='loading', note='';
const loaded=new Set();
const ui={view:'painel', resDia:today(), finTipo:'receber', finFiltro:'abertas', buscaCli:'', buscaFin:''};

/* ---------- utilidades ---------- */
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
function fmtD(s){if(!s)return '—';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y}
function fmtDCurto(s){if(!s)return '—';const [,m,d]=s.split('-');return d+'/'+m}
const DIAS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function diaSemana(s){return DIAS[new Date(s+'T12:00:00').getDay()]}
const fmtBRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function brl(v){return fmtBRL.format(Number(v)||0)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function sum(a,f){return a.reduce((t,x)=>t+(Number(f?f(x):x)||0),0)}
function hm(t){if(!t)return 0;const [h,m]=t.split(':').map(Number);return h+(m||0)/60}
function byId(col,id){return S[col].find(x=>x.id===id)}
function nome(col,id,fb){const r=byId(col,id);return r?r.nome:(fb||'—')}
function mesAtual(){return today().slice(0,7)}

/* ---------- armazenamento (Supabase) ---------- */
let sb=null, sessao=null, canal=null, carregou=false;
function errMsg(e){
  const c=e&&(e.code||'');const m=String(e&&e.message||'');
  if(c==='42501'||/row-level security|permission/i.test(m))return 'Você não tem permissão para alterar estes dados.';
  if(/JWT|expired/i.test(m))return 'Sua sessão expirou. Saia e entre de novo.';
  return 'Não foi possível salvar. Verifique a conexão e tente de novo.';
}
function clean(o){const r={};for(const k in o){if(k!=='id'&&o[k]!==undefined)r[k]=o[k]}return r}
function aplicar(col,id,body){if(!S[col])return;const row=Object.assign({id},body);const i=S[col].findIndex(x=>x.id===id);if(i>=0)S[col][i]=row;else S[col].push(row)}
async function put(col,id,data){
  const body=clean(data);
  const {error}=await sb.from('registros').upsert({colecao:col,id,dados:body,atualizado_em:new Date().toISOString()});
  if(error){toast(errMsg(error),'bad');throw error}
  aplicar(col,id,body);schedule();
}
async function patch(col,id,changes){const cur=byId(col,id);if(!cur)return;await put(col,id,Object.assign({},cur,changes))}
async function remove(col,id){
  const {error}=await sb.from('registros').delete().eq('colecao',col).eq('id',id);
  if(error){toast(errMsg(error),'bad');throw error}
  S[col]=S[col].filter(x=>x.id!==id);schedule();
}
async function buscarTudo(){
  let all=[],from=0;
  for(;;){const {data,error}=await sb.from('registros').select('colecao,id,dados').range(from,from+999);
    if(error)throw error;all=all.concat(data||[]);if(!data||data.length<1000)break;from+=1000}
  return all;
}
async function carregar(){
  if(carregou)return;carregou=true;mode='loading';note='';render();
  try{
    const rows=await buscarTudo();
    COLS.forEach(c=>S[c]=[]);rows.forEach(r=>aplicar(r.colecao,r.id,r.dados||{}));
    COLS.forEach(c=>loaded.add(c));mode='live';
    canal=sb.channel('registros-tempo-real')
      .on('postgres_changes',{event:'*',schema:'public',table:'registros'},p=>{
        if(p.eventType==='DELETE'){const o=p.old||{};if(S[o.colecao])S[o.colecao]=S[o.colecao].filter(x=>x.id!==o.id)}
        else{const n=p.new||{};aplicar(n.colecao,n.id,n.dados||{})}
        schedule();
      }).subscribe();
  }catch(e){mode='live';note='Não foi possível carregar os dados ('+(e.message||'erro de conexão')+'). Recarregue a página.'}
  schedule();
}
function sair(){
  try{if(canal)sb.removeChannel(canal)}catch(e){}
  canal=null;carregou=false;COLS.forEach(c=>S[c]=[]);loaded.clear();
  return sb.auth.signOut();
}
async function init(){
  const url=window.SUPABASE_URL||'',key=window.SUPABASE_ANON_KEY||'';
  if(!url||!key||url.indexOf('COLE')>=0||!window.supabase){mode='config';render();return}
  sb=window.supabase.createClient(url,key);
  sb.auth.onAuthStateChange((ev,s)=>{
    sessao=s;
    if(s){setTimeout(carregar,0)}else{mode='login';carregou=false;render()}
  });
  const {data}=await sb.auth.getSession();sessao=data.session;
  if(sessao)carregar();else{mode='login';render()}
}

/* ---------- regras de negócio ---------- */
function saldoConta(c){
  const ent=sum(S.lancamentos.filter(l=>l.pago&&l.contaId===c.id&&l.tipo==='receber'),l=>l.valor);
  const sai=sum(S.lancamentos.filter(l=>l.pago&&l.contaId===c.id&&l.tipo==='pagar'),l=>l.valor);
  return (Number(c.saldoInicial)||0)+ent-sai;
}
function saldoTotal(){return sum(S.contas,saldoConta)}
function abertos(tipo){return S.lancamentos.filter(l=>l.tipo===tipo&&!l.pago)}
function statusLanc(l){const t=today();if(l.pago)return ['Pago','ok'];if(l.vencimento<t)return ['Vencido','bad'];if(l.vencimento===t)return ['Vence hoje','warn'];return ['Em aberto','info']}
function contratosAtivos(){return S.contratos.filter(c=>c.status==='ativo')}
function mrr(){return sum(contratosAtivos(),c=>c.valorMensal)}
function reservasPendentes(){const t=today();return S.reservas.filter(r=>r.data<t&&(r.status==='agendada'||r.status==='em uso'))}
const STATUS_RES={agendada:['Agendada','info'],'em uso':['Em uso','warn'],'concluída':['Concluída','ok'],cancelada:['Cancelada','mute']};
const ETAPAS=[['novo','Novo contato'],['contato','Em conversa'],['visita','Visita marcada'],['proposta','Proposta enviada'],['fechado','Fechado'],['perdido','Perdido']];
const ORIGENS=['Instagram','WhatsApp','Indicação','Google','Evento','Visita espontânea','Site','Outro'];

let modalState=null;
function openForm(o){modalState=o;renderModal()}
function closeModal(){modalState=null;renderModal()}
function fieldHtml(f,v){
  const id='f-'+f.k;const val=v[f.k];
  const cls='field'+(f.full?' full':'')+(f.t==='check'?' check':'');
  if(f.t==='check')return `<div class="${cls}"><input type="checkbox" id="${id}" name="${f.k}" ${val?'checked':''}><label for="${id}">${esc(f.l)}</label></div>`;
  let input;
  if(f.t==='select'){const os=f.opts(v);if(!os.length)os.push(['','—']);input=`<select class="input" id="${id}" name="${f.k}">${os.map(([k,l])=>`<option value="${esc(k)}" ${String(val??'')===String(k)?'selected':''}>${esc(l)}</option>`).join('')}</select>`}
  else if(f.t==='textarea')input=`<textarea class="input" id="${id}" name="${f.k}">${esc(val)}</textarea>`;
  else input=`<input class="input" id="${id}" name="${f.k}" type="${f.t}" ${f.step?`step="${f.step}"`:''} ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} value="${esc(val??'')}" ${f.req?'required':''}>`;
  return `<div class="${cls}"><label for="${id}">${esc(f.l)}${f.req?' *':''}</label>${input}</div>`;
}
function renderModal(){
  const root=document.getElementById('modal-root');
  if(!modalState){root.innerHTML='';return}
  const m=modalState;
  if(m.confirm){
    root.innerHTML=`<div class="overlay" data-act="close-overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-t">
      <header><h2 id="m-t">${esc(m.title)}</h2></header><p class="msg">${esc(m.message)}</p>
      <footer><button class="btn" type="button" data-act="close">Voltar</button><button class="btn ${m.danger?'danger':'primary'}" type="button" data-act="confirm-ok" id="m-ok">${esc(m.okLabel||'Confirmar')}</button></footer></div></div>`;
    setTimeout(()=>{const b=document.getElementById('m-ok');b&&b.focus()},0);return;
  }
  const v=m.values||{};
  root.innerHTML=`<div class="overlay" data-act="close-overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-t">
    <header><h2 id="m-t">${esc(m.title)}</h2><button class="btn ghost sm" type="button" data-act="close" aria-label="Fechar">Fechar</button></header>
    <form id="m-form" novalidate><div class="fields">${m.fields.map(f=>fieldHtml(f,v)).join('')}</div>
    <div class="form-err" id="m-err" role="alert"></div>
    <footer><button class="btn" type="button" data-act="close">Cancelar</button><button class="btn primary" type="submit">${esc(m.submitLabel||'Salvar')}</button></footer></form></div></div>`;
  const first=root.querySelector('input,select,textarea');first&&first.focus();
  root.querySelector('#m-form').addEventListener('submit',async ev=>{
    ev.preventDefault();
    const fd=new FormData(ev.target);const out={};
    for(const f of m.fields){
      if(f.t==='check'){out[f.k]=fd.get(f.k)==='on';continue}
      let x=fd.get(f.k);x=x==null?'':String(x).trim();
      if(f.t==='number'){out[f.k]=x===''?null:Number(x.replace(',','.'))}else out[f.k]=x;
      if(f.req&&(x===''||x==null)){showErr('Preencha o campo “'+f.l.replace(/ —.*/,'')+'”.');return}
    }
    const err=m.validate?m.validate(out):null;if(err){showErr(err);return}
    const btn=ev.target.querySelector('[type=submit]');btn.disabled=true;
    try{await m.onSave(out);closeModal()}catch(e){btn.disabled=false;showErr(errMsg(e))}
  });
  const tipoSel=root.querySelector('#f-tipo');
  if(tipoSel&&m.col==='lancamentos'){tipoSel.addEventListener('change',()=>{const c=root.querySelector('#f-categoria');const list=tipoSel.value==='pagar'?CATEG_PAG:CATEG_REC;c.innerHTML=list.map(x=>`<option>${esc(x)}</option>`).join('')})}
}
function showErr(t){const e=document.getElementById('m-err');if(e){e.textContent=t;e.style.paddingBottom='4px'}}
function defaults(col,preset){
  const v={};for(const f of SCHEMAS[col].fields){if(f.def!==undefined)v[f.k]=typeof f.def==='function'?f.def():f.def}
  return Object.assign(v,preset||{});
}
function formFor(col,id,preset){
  const sc=SCHEMAS[col];const cur=id?byId(col,id):null;
  const values=cur?Object.assign({},cur):defaults(col,preset);
  openForm({col,title:(cur?'Editar ':'Novo ')+sc.titulo,fields:sc.fields,values,
    validate:(o)=>validar(col,o,id),
    onSave:async(o)=>{
      const data=Object.assign({},cur||{},prepare(col,o,cur));
      if(!cur)data.criadoEm=new Date().toISOString();
      await put(col,id||newId(),data);toast((cur?'Alterações salvas':'Registro criado'));
    }});
}
function validar(col,o,id){
  if(col==='reservas'){
    if(hm(o.fim)<=hm(o.inicio))return 'O horário de fim precisa ser depois do início.';
    if(o.status!=='cancelada'){const c=conflito(o,id);if(c)return `Esse espaço já está reservado das ${c.inicio} às ${c.fim} para ${nome('clientes',c.clienteId,'outro cliente')}.`}
  }
  if(col==='contratos'){if(o.fim&&o.fim<o.inicio)return 'A data de fim não pode ser antes do início.';if(o.valorMensal==null&&!o.planoId)return 'Informe o valor mensal ou escolha um plano.'}
  if(col==='lancamentos'&&!(o.valor>0))return 'Informe um valor maior que zero.';
  return null;
}
function prepare(col,o,cur){
  if(col==='reservas'&&(o.valor==null)){const e=byId('espacos',o.espacoId);o.valor=e?Math.round((hm(o.fim)-hm(o.inicio))*(Number(e.valorHora)||0)*100)/100:0}
  if(col==='contratos'&&o.valorMensal==null){const p=byId('planos',o.planoId);o.valorMensal=p?Number(p.valor)||0:0}
  if(col==='lancamentos'){if(o.pago&&!(cur&&cur.pago))o.pagoEm=today();if(!o.pago)o.pagoEm=null}
  return o;
}
function confirmar(title,message,okLabel,onOk,danger){openForm({confirm:1,title,message,okLabel,onOk,danger})}

function niceStep(range){const raw=range/4;const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function chartFluxo(){
  const t=today();let saldo=saldoTotal();const pts=[];let ent=0,sai=0;
  for(let i=0;i<30;i++){const d=addDays(t,i);
    const e=sum(S.lancamentos.filter(l=>!l.pago&&l.tipo==='receber'&&l.vencimento===d),l=>l.valor);
    const s=sum(S.lancamentos.filter(l=>!l.pago&&l.tipo==='pagar'&&l.vencimento===d),l=>l.valor);
    ent+=e;sai+=s;saldo+=e-s;pts.push({d,v:saldo,e,s});}
  if(!S.contas.length&&!S.lancamentos.length)return empty('Cadastre contas e lançamentos para ver a projeção.');
  const W=640,H=220,L=78,R=14,T=14,B=28;
  let mn=Math.min(...pts.map(p=>p.v),0),mx=Math.max(...pts.map(p=>p.v));if(mx===mn)mx=mn+1000;
  const st=niceStep(mx-mn);mn=Math.floor(mn/st)*st;mx=Math.ceil(mx/st)*st;
  const x=i=>L+(W-L-R)*i/29,y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let grid='';for(let v=mn;v<=mx+1e-6;v+=st){grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${esc(brl(v).replace(/,00$/,''))}</text>`}
  let xl='';for(let i=0;i<30;i+=7)xl+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${fmtDCurto(pts[i].d)}</text>`;
  const line=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=line+` L${x(29)} ${y(Math.max(mn,0))} L${x(0)} ${y(Math.max(mn,0))} Z`;
  const last=pts[29];const zero=mn<0?`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--bad)" stroke-dasharray="4 4"/>`:'';
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px;display:block" role="img" aria-label="Saldo projetado para 30 dias, terminando em ${esc(brl(last.v))}">
    ${grid}${zero}<path d="${area}" fill="var(--accent-soft)" stroke="none"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(29)}" cy="${y(last.v)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>${xl}</svg></div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem"><span>Entradas previstas <b style="color:var(--ok)">${brl(ent)}</b></span><span>Saídas previstas <b style="color:var(--bad)">${brl(sai)}</b></span><span>Saldo em ${fmtDCurto(last.d)} <b>${brl(last.v)}</b></span></div>`;
}

function filtroFin(l,f){const t=today(),sem=addDays(t,7),m=mesAtual();

  </section>
  <section class="panel"><div class="panel-h"><h2>Planos</h2><button class="btn ghost sm" data-act="new:planos">Novo</button></div>
    ${S.planos.length?`<div class="list">${S.planos.map(p=>`<div class="li"><div class="l"><b>${esc(p.nome)}</b><span>${brl(p.valor)}/mês${Number(p.horasIncluidas)?' · '+p.horasIncluidas+'h de sala':''}</span></div><div class="r"><button class="btn ghost sm" data-act="edit:planos:${p.id}">Editar</button><button class="btn ghost sm" data-act="del:planos:${p.id}">Excluir</button></div></div>`).join('')}</div>`:empty('Nenhum plano cadastrado.','new:planos','Novo plano')}
  </section>
  <section class="panel"><div class="panel-h"><h2>Contas e caixa</h2><button class="btn ghost sm" data-act="new:contas">Nova</button></div>
    ${S.contas.length?`<div class="list">${S.contas.map(c=>`<div class="li"><div class="l"><b>${esc(c.nome)}</b><span>Saldo inicial ${brl(c.saldoInicial)}</span></div><div class="r"><button class="btn ghost sm" data-act="edit:contas:${c.id}">Editar</button><button class="btn ghost sm" data-act="del:contas:${c.id}">Excluir</button></div></div>`).join('')}</div>`:empty('Nenhuma conta cadastrada.','new:contas','Nova conta')}
  </section></div>`;
}

/* ---------- render ---------- */
let raf=0;
function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})}
function render(){
  const a=document.activeElement;const fid=a&&a.id&&(a.id==='busca-cli'||a.id==='busca-fin')?a.id:null;const sel=fid?a.selectionStart:null;
  const auth=mode==='login'||mode==='config';document.body.classList.toggle('auth',auth);
  if(auth){document.getElementById('view').innerHTML=mode==='login'?viewLogin():viewConfig();return}
  renderNav();
  const v={painel:viewPainel,reservas:viewReservas,clientes:viewClientes,contratos:viewContratos,financeiro:viewFinanceiro,comercial:viewComercial,cadastros:viewCadastros}[ui.view];
  document.getElementById('view').innerHTML=v();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(sel,sel)}catch(e){}}}
}

/* ---------- ações ---------- */
document.addEventListener('input',e=>{
  if(e.target.id==='busca-cli'){ui.buscaCli=e.target.value;render()}
  if(e.target.id==='busca-fin'){ui.buscaFin=e.target.value;render()}
});
document.addEventListener('change',e=>{if(e.target.id==='res-dia'&&e.target.value){ui.resDia=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalState)closeModal()});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.getAttribute('data-act');
  if(act==='close-overlay'){if(e.target===el)closeModal();return}
  e.preventDefault();
  const [a,b,c]=act.split(':');
  try{
  if(a==='sair'){await sair();return}
  if(a==='close')return closeModal();
  if(a==='confirm-ok'){const m=modalState;el.disabled=true;try{await m.onOk();closeModal()}catch(err){el.disabled=false}return}
  if(a==='new'){const preset={};if(c){const [k,v]=c.split('=');preset[k]=v}return formFor(b,null,preset)}
  if(a==='edit')return formFor(b,c);
  if(a==='del'){const r=byId(b,c);return confirmar('Excluir '+SCHEMAS[b].titulo+'?','“'+(r&&(r.nome||r.descricao)||'Registro')+'” será apagado de vez. Registros ligados a ele continuam existindo.','Excluir',async()=>{await remove(b,c);toast('Excluído')},true)}
  if(a==='dia'){ui.resDia=b==='0'?today():addDays(ui.resDia,Number(b));return render()}
  if(a==='res'){const r=byId('reservas',b);if(!r)return;
    if(c==='cancelada')return confirmar('Cancelar reserva?',`${nome('clientes',r.clienteId)} · ${nome('espacos',r.espacoId)} em ${fmtD(r.data)}, ${r.inicio}–${r.fim}.`,'Cancelar reserva',async()=>{await patch('reservas',b,{status:'cancelada'});toast('Reserva cancelada')},true);
    await patch('reservas',b,{status:c});return toast(c==='em uso'?'Check-in registrado':'Check-out registrado')}
  if(a==='concluir-pendentes'){const p=reservasPendentes();for(const r of p)await patch('reservas',r.id,{status:'concluída'});return toast(p.length+' reservas concluídas')}
  if(a==='cobrar'){const r=byId('reservas',b);const lid='res-'+r.id;
    await put('lancamentos',lid,{tipo:'receber',categoria:'Reserva avulsa',descricao:'Reserva '+nome('espacos',r.espacoId)+' · '+fmtDCurto(r.data)+' '+r.inicio,clienteId:r.clienteId,valor:Number(r.valor)||0,vencimento:r.data,contaId:S.contas[0]?S.contas[0].id:'',pago:false,criadoEm:new Date().toISOString()});
    await patch('reservas',r.id,{lancamentoId:lid});return toast('Cobrança criada no financeiro')}
  if(a==='faturar'){const m=mesAtual(),[y,mm]=m.split('-');let n=0;
    for(const ct of contratosAtivos()){const lid='fat-'+ct.id+'-'+y+mm;if(byId('lancamentos',lid))continue;
      const dia=Math.min(28,Math.max(1,Number(ct.diaVencimento)||10));
      await put('lancamentos',lid,{tipo:'receber',categoria:'Mensalidade',descricao:'Mensalidade '+MESES[Number(mm)-1]+' · '+nome('planos',ct.planoId,'contrato'),clienteId:ct.clienteId,contratoId:ct.id,valor:Number(ct.valorMensal)||0,vencimento:m+'-'+pad(dia),contaId:S.contas[0]?S.contas[0].id:'',pago:false,criadoEm:new Date().toISOString()});n++}
    return toast(n+' mensalidade(s) gerada(s)')}
  if(a==='encerrar'){const ct=byId('contratos',b);return confirmar('Encerrar contrato?','O contrato de '+nome('clientes',ct.clienteId)+' termina hoje e deixa de gerar mensalidades.','Encerrar',async()=>{await patch('contratos',b,{status:'encerrado',fim:today()});toast('Contrato encerrado')},true)}
  if(a==='fintipo'){ui.finTipo=b;return render()}
  if(a==='finf'){ui.finFiltro=b;return render()}
  if(a==='baixar'){const l=byId('lancamentos',b);
    return openForm({title:(l.tipo==='receber'?'Registrar recebimento':'Registrar pagamento'),values:{contaId:l.contaId||(S.contas[0]&&S.contas[0].id)||'',pagoEm:today(),valor:l.valor},
      fields:[{k:'contaId',l:'Conta',t:'select',opts:optCol('contas'),req:1,full:1},{k:'pagoEm',l:'Data',t:'date',req:1},{k:'valor',l:'Valor (R$)',t:'number',step:'0.01',req:1}],
      submitLabel:'Confirmar',onSave:async o=>{await patch('lancamentos',b,{pago:true,contaId:o.contaId,pagoEm:o.pagoEm,valor:o.valor});toast(l.tipo==='receber'?'Recebimento registrado':'Pagamento registrado')}})}
  if(a==='estornar'){await patch('lancamentos',b,{pago:false,pagoEm:null});return toast('Baixa desfeita')}
  if(a==='mover'){await patch('leads',b,{etapa:c});return}
  if(a==='converter'){const l=byId('leads',b);const cid=newId();
    await put('clientes',cid,{nome:l.empresa||l.nome,tipo:l.empresa?'PJ':'PF',contato:l.nome,telefone:l.telefone||'',status:'ativo',criadoEm:new Date().toISOString()});
    await patch('leads',b,{etapa:'fechado',clienteId:cid});toast('Cliente criado a partir da oportunidade');return}
  if(a==='limpar-exemplos'){return confirmar('Remover exemplos?','Apaga todos os registros marcados como exemplo. Seus próprios cadastros ficam.','Remover',async()=>{for(const c of COLS)for(const x of S[c].filter(r=>r.exemplo))await remove(c,x.id);toast('Exemplos removidos')},true)}
  }catch(err){/* toast já exibido */}
});

document.addEventListener('submit',async e=>{
  if(e.target.id!=='login-form')return;e.preventDefault();
  const err=document.getElementById('l-err');err.textContent='';
  const btn=e.target.querySelector('[type=submit]');btn.disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:document.getElementById('l-email').value.trim(),password:document.getElementById('l-senha').value});
  btn.disabled=false;
  if(error)err.textContent=/invalid/i.test(error.message)?'E-mail ou senha incorretos.':'Não foi possível entrar. Verifique a conexão.';
});
readHash();
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
